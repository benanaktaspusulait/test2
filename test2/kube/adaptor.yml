          - name: FDP_KAFKA_BROKER
            valueFrom:
              secretKeyRef:
                name: environment
                key: "{{ $.FDP_KAFKA_BROKER_KEY_NAME }}"
          - name: FDP_KAFKA_SCHEMA_REGISTRY_URL
            valueFrom:
              secretKeyRef:
                name: environment
                key: FDP_KAFKA_SCHEMA_REGISTRY_URL
          - name: FDP_KAFKA_STREAM_THREADS
            value: "{{ $.FDP_KAFKA_STREAM_THREADS }}"
          - name: FDP_KAFKA_SESSION_TIMEOUT_MS
            value: "{{ $.FDP_KAFKA_SESSION_TIMEOUT_MS }}"
          - name: FDP_KAFKA_POLL_INTERVAL_MS
            value: "{{ $.FDP_KAFKA_POLL_INTERVAL_MS }}"
          - name: FDP_KAFKA_MAX_POLL_RECORDS
            value: "{{ $.FDP_KAFKA_MAX_POLL_RECORDS }}"
          - name: FDP_KAFKA_REBALANCE_TIMEOUT_MS
            value: "{{ $.FDP_KAFKA_REBALANCE_TIMEOUT_MS }}"
          - name: FDP_KAFKA_MAX_REQUEST_SIZE
            value: "{{ $.FDP_KAFKA_MAX_REQUEST_SIZE }}"
          - name: FDP_KAFKA_TASK_TIMEOUT_MS
            value: "{{ $.FDP_KAFKA_TASK_TIMEOUT_MS }}"
          - name: LOG_LEVEL
            valueFrom:
              secretKeyRef:
                name: environment
                key: LOG_LEVEL
          - name: SPRING_PROFILES_ACTIVE
            value: "{{ $.SPRING_PROFILES_ACTIVE }}"
          - name: FDP_APP_KAFKA_TOPIC_SUFFIX
            value: {{ $.FDP_APP_KAFKA_TOPIC_SUFFIX }}
        image: {{ $.IMAGE_URL }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /cmd-adaptor-{{ $.ADAPTOR_NAME }}-{{ $.FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/liveness
            port: 7112
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /cmd-adaptor-{{ $.ADAPTOR_NAME }}-{{ $.FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/readiness
            port: 7112
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "{{ $.FDP_CMD_ADAPTOR_CPU_MAX }}"
            memory: "{{ $.FDP_CMD_ADAPTOR_MEMORY_MAX }}"
          requests:
            cpu: "{{ $.FDP_CMD_ADAPTOR_CPU_MIN }}"
            memory: "{{ $.FDP_CMD_ADAPTOR_MEMORY_MIN }}"
        volumeMounts:
          - mountPath: "/home/fdpuser/fdp-msk/"
            name: app-msk-app-keystore
            readOnly: true
          - mountPath: "/home/fdpuser/fdp-app-cdl-msk/"
            name: "fdp-app-cdl-msk-keystore"
            readOnly: true
        securityContext:
          runAsUser: 1000
      - name: fdp-jaeger-agent
        image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/dacc/jaegertracing/jaeger-agent:stable
        args: [ "--reporter.grpc.host-port=dns:///fdp-jaeger-collector-svc.{{ $.JAEGER_NAMESPACE }}.svc.cluster.local:14250","--reporter.type=grpc","--processor.zipkin-compact.server-queue-size={{ $.FDP_SPANS_QUEUE_SIZE }}" ]
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          limits:
            memory: {{ $.FDP_JAEGER_MEMORY_MAX }}
            cpu: {{ $.FDP_JAEGER_CPU_MAX }}
          requests:
            memory: {{ $.FDP_JAEGER_MEMORY_MIN }}
            cpu: {{ $.FDP_JAEGER_CPU_MIN }}
  {{end}}
