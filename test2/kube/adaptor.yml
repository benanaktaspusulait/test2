{{ $endOfYamlDoc := "---" }}
{{- if and (ne .ADAPTOR_NAME "pcdp") (ne .ADAPTOR_NAME "crs") }}
  {{/*
  This block of code is for feed with single adaptor deployment.
  Feed - PCDP and CRS will be deployed with 2 adaptors -
  1. to attach to the original CDLZ MSK cluster to be able to access to joins topics.
  2. to connect to the new MSK cluster in CDLZ exclusively to connect to R36 data for PCDP and CRS data to CRS.
  */}}
{{if eq .FDP_FEED_NAME "ctp"}}
  {{/*
  This block of code is to deploy a Kube Service in front of the CTP adaptor
  in order to expose its internal API and to provide a suitable netpol.
  */}}
#############################################################################
# WARNING: This file is controlled via RepoSync, any changes made in the
# command adaptor repository will be overwritten by the RepoSync process.
# See https://gitlab.digital.homeoffice.gov.uk/dacc-de/dde-adaptor-reposync
#############################################################################
apiVersion: v1
kind: Service
metadata:
  name: fdp-cmd-adaptor-ctp
spec:
  selector:
    app: fdp-app
    pipeline_name: fdp-ctp
    service_name: fdp-ctp
  type: ClusterIP
  ports:
    - name: fdp-cmd-adaptor-ctp
      port: 7112
      targetPort: 7112
{{ $endOfYamlDoc }}
# This policy allows Unadjusted command adaptors to communicate with
# each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ctp-adaptor-comms
spec:
  podSelector:
    matchLabels:
      service_name: fdp-ctp
  ingress:
    - from:
      - podSelector:
          matchLabels:
            service_name: fdp-ctp
{{end}}
{{ $endOfYamlDoc }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    pipeline_name: fdp-{{ .FDP_FEED_NAME }}
    app: fdp-app
{{if eq .FDP_FEED_NAME "ctp"}}
    service_name: fdp-ctp
{{end}}
  {{if eq .ADAPTOR_NAME "placi"}}
  name: fdp-cmd-adaptor-{{ .ADAPTOR_NAME }}-{{ .FEED_NAME }}
  {{else}}
  name: fdp-cmd-adaptor-{{ .ADAPTOR_NAME }}
  {{end}}
  {{if .WORKING_HOURS}}
  annotations:
    downscaler/uptime: {{ .WORKING_HOURS }}
  {{end}}
spec:
  replicas: {{ .FDP_CMD_ADAPTOR_REPLICAS }}
  selector:
    matchLabels:
      app: fdp-app
      pipeline_name: fdp-{{ .ADAPTOR_NAME }}
{{if eq .FDP_FEED_NAME "ctp"}}
      service_name: fdp-ctp
{{end}}
  template:
    metadata:
      labels:
        app: fdp-app
        pipeline_name: fdp-{{ .ADAPTOR_NAME }}
{{if eq .FDP_FEED_NAME "ctp"}}
        service_name: fdp-ctp
{{end}}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7112"
  {{if eq .FDP_FEED_NAME "api"}}
        prometheus.io/path: "/cmd-adaptor-api-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/prometheus"
  {{else if eq .ADAPTOR_NAME "roro-tsv-test"}}
        prometheus.io/path: "/cmd-adaptor-roro-tsv-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/prometheus"
  {{else if eq .ADAPTOR_NAME "roro-xml-test"}}
        prometheus.io/path: "/cmd-adaptor-roro-xml-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/prometheus"
  {{else}}
        prometheus.io/path: "/cmd-adaptor-{{ .ADAPTOR_NAME }}-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/prometheus"
  {{end}}
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: "{{ .ARTIFACTORY_SECRET_NAME }}"
      volumes:
        - name: app-msk-app-keystore
          secret:
            secretName: app-msk-app-keystore
            defaultMode: 256
        - name: "{{ .FDP_APP_CDL_MSK_SECRET_NAME }}"
          secret:
            secretName: "{{ .FDP_APP_CDL_MSK_SECRET_NAME }}"
            defaultMode: 256
      containers:
      - name: "fdp-cmd-adaptor-{{ .ADAPTOR_NAME }}"
{{if eq .FDP_FEED_NAME "ctp"}}
        ports:
          - containerPort: 7112
            name: http
{{end}}
        env:
          - name: ADAPTOR_NAME
            value: "{{ .ADAPTOR_NAME }}"
          - name: ENVIRONMENT
            valueFrom:
              secretKeyRef:
                name: environment
                key: ENVIRONMENT
  {{if .FDP_APP_CDL_KAFKA_GROUP_ID}}
          - name: FDP_APP_CDL_KAFKA_GROUP_ID
            value: {{ .FDP_APP_CDL_KAFKA_GROUP_ID }}
  {{end}}
          - name: FDP_APP_MSK_APP_KEYSTORE_PATH
            value: "/home/fdpuser/fdp-msk/app-msk-app.jks"
          - name: FDP_APP_CDL_MSK_KEYSTORE_PATH
            value: "{{ .FDP_APP_CDL_MSK_KEYSTORE_PATH }}"
          - name: FDP_APP_MSK_APP_KEYSTORE_PASS
            valueFrom:
              secretKeyRef:
                name: environment
                key: FDP_APP_MSK_APP_KEYSTORE_PASS
          - name: FDP_APP_CDL_MSK_KEYSTORE_PASS
            valueFrom:
              secretKeyRef:
                name: environment
                key: "{{ .FDP_APP_CDL_MSK_KEYSTORE_PASS_KEY_NAME }}"
          - name: FDP_APP_CDL_KAFKA_BROKER
            valueFrom:
              secretKeyRef:
                name: environment
                key: "{{ .FDP_APP_CDL_KAFKA_BROKER_KEY_NAME }}"
          - name: FDP_APP_CDL_KAFKA_SCHEMA_REGISTRY_URL
            valueFrom:
              secretKeyRef:
                name: environment
                key: "{{ .FDP_APP_CDL_KAFKA_SCHEMA_REGISTRY_URL_KEY_NAME }}"
          - name: FDP_APP_REDIS_NODES
            valueFrom:
              secretKeyRef:
                name: environment
                key: "{{ .FDP_APP_REDIS_NODES_KEY_NAME }}"
  {{if eq .ADAPTOR_NAME "bitd"}}
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_1
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_1 }}"
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_2
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_2 }}"
  {{else if eq .ADAPTOR_NAME "brp"}}
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_IC
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_IC }}"
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_OS
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_OS }}"
  {{else if eq .ADAPTOR_NAME "cop"}}
          - name: FDP_CMD_ADAPTOR_STREAM_CASHEABSILVER_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CERBERUSFEEDBACKGOLD_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CERBERUSOUTCOMESGOLD_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CONSIGNMENTDETAILSEABSILVER_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_FIREARMSEABSILVER_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ITEMSEABSILVER_RUN
