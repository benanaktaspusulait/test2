            readOnly: true
          - mountPath: "{{ .FDP_APP_CDL_MSK_SECRET_MOUNT_PATH }}"
            name: "{{ .FDP_APP_CDL_MSK_SECRET_NAME }}"
            readOnly: true
        securityContext:
          runAsUser: 1000
      - name: fdp-jaeger-agent
        image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/dacc/jaegertracing/jaeger-agent:stable
        args: [ "--reporter.grpc.host-port=dns:///fdp-jaeger-collector-svc.{{ .JAEGER_NAMESPACE }}.svc.cluster.local:14250","--reporter.type=grpc","--processor.zipkin-compact.server-queue-size={{ .FDP_SPANS_QUEUE_SIZE }}" ]
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          limits:
            memory: {{ .FDP_JAEGER_MEMORY_MAX }}
            cpu: {{ .FDP_JAEGER_CPU_MAX }}
          requests:
            memory: {{ .FDP_JAEGER_MEMORY_MIN }}
            cpu: {{ .FDP_JAEGER_CPU_MIN }}
  {{/* End of the template for any non-PCDP adaptor. */}}
{{else}}
{{/*
   This block is specifically for deploying two PCDP/CRS adaptors.
   The two adaptors are joins and "r36" for PCDP/"crs" for CRS ( -> Adaptor2).
   Both are deployed with the identical config with the exception of the
   feature switches which will be switched on or off depending on the adaptor type.
   */}}

  {{range split "joins,adaptor2" ","}}
  {{/* Iterate over a list containing "joins" and adaptor2 -> "r36"/"crs" elements. */}}
{{ $endOfYamlDoc }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    pipeline_name: fdp-{{ $.FDP_FEED_NAME }}
    app: fdp-app
  {{if and (eq . "joins") (eq $.FDP_FEED_NAME "pcdp")}}
  name: fdp-cmd-adaptor-{{ $.ADAPTOR_NAME }}-{{ . }}
  {{else if and (ne . "joins") (eq $.FDP_FEED_NAME "pcdp")}}
  name: fdp-cmd-adaptor-{{ $.ADAPTOR_NAME }}-r36
  {{else if and (eq . "joins") (eq $.FDP_FEED_NAME "crs")}}
  name: fdp-cmd-adaptor-{{ $.ADAPTOR_NAME }}-crs{{ . }}
  {{else if and (ne . "joins") (eq $.FDP_FEED_NAME "crs")}}
  name: fdp-cmd-adaptor-{{ $.ADAPTOR_NAME }}-{{ $.FDP_FEED_NAME }}
  {{end}}
  {{if $.WORKING_HOURS}}
  annotations:
    downscaler/uptime: {{ $.WORKING_HOURS }}
  {{end}}
spec:
  replicas: {{ $.FDP_CMD_ADAPTOR_REPLICAS }}
  selector:
    matchLabels:
      app: fdp-app
      pipeline_name: fdp-{{ $.ADAPTOR_NAME }}
  template:
    metadata:
      labels:
        app: fdp-app
        pipeline_name: fdp-{{ $.ADAPTOR_NAME }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7112"
        prometheus.io/path: "/cmd-adaptor-{{ $.ADAPTOR_NAME }}-{{ $.FDP_APP_KAFKA_TOPIC_SUFFIX }}/prometheus"
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: "{{ $.ARTIFACTORY_SECRET_NAME }}"
      volumes:
        - name: app-msk-app-keystore
          secret:
            secretName: app-msk-app-keystore
            defaultMode: 256
        - name: "fdp-app-cdl-msk-keystore"
          secret:
      {{if eq . "joins"}}
      {{/* Volumes for joins adaptor. */}}
            secretName: "fdp-app-cdl-msk-keystore"
      {{else}}
      {{/* Volumes for r36/crs adaptor. */}}
            secretName: "fdp-dbstream-cdl-msk-keystore"
      {{end}}
            defaultMode: 256
      containers:
      - name: "fdp-cmd-adaptor-{{ $.ADAPTOR_NAME }}"
        env:
      {{if and (eq . "joins") (eq $.FDP_FEED_NAME "pcdp") }}
      {{/* Feed PCDP - Feature switches for joins adaptor. */}}
          - name: FDP_CMD_ADAPTOR_STREAM_ADDRESS_JOIN_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ARTEFACT_JOIN_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ATLAS_ARTEFACT_IDENTITY_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CID_ARTEFACT_IDENTITY_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CRS_INGEST_JOIN_ADDRESS_RUN
            value: "true"
      {{else if and (ne . "joins") (eq $.FDP_FEED_NAME "pcdp") }}
      {{/* Feature switches for r36 adaptor. */}}
          - name: FDP_CMD_ADAPTOR_STREAM_ADDRESS_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ALL_EVENT_ATTRIBUTE_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ASSOCIATION_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ARTEFACT_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_BIOGRAPHIC_SET_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_BIOMETRIC_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CONDITION_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_CID_CRS_ALL_EVENT_ATTRIBUTE_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_ELECTRONIC_ADDRESS_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_IDENTITY_RUN
            value: "true"
          - name: FDP_CMD_ADAPTOR_STREAM_IDENTITY_CONSOLIDATED_PERSON_RUN
