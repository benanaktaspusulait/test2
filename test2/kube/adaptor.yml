        image: {{ .IMAGE_URL }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
  {{if eq .FDP_FEED_NAME "api"}}
            path: /cmd-adaptor-api-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/liveness
  {{else if eq .ADAPTOR_NAME "roro-tsv-test"}}
            path: /cmd-adaptor-roro-tsv-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/liveness
  {{else if eq .ADAPTOR_NAME "roro-xml-test"}}
            path: /cmd-adaptor-roro-xml-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/liveness
  {{else}}
            path: /cmd-adaptor-{{ .ADAPTOR_NAME }}-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/liveness
  {{end}}
            port: 7112
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
  {{if eq .FDP_FEED_NAME "api"}}
            path: /cmd-adaptor-api-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/readiness
  {{else if eq .ADAPTOR_NAME "roro-tsv-test"}}
            path: /cmd-adaptor-roro-tsv-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/readiness
  {{else if eq .ADAPTOR_NAME "roro-xml-test"}}
            path: /cmd-adaptor-roro-xml-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/readiness
  {{else}}
            path: /cmd-adaptor-{{ .ADAPTOR_NAME }}-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/readiness
  {{end}}
            port: 7112
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
