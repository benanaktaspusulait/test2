  {{else if eq .ADAPTOR_NAME "ctp"}}
          - name: FDP_APP_CDL_KAFKA_GROUP_ID
            value: "{{ .FDP_APP_CDL_KAFKA_GROUP_ID }}"
          - name: FDP_APP_CDL_KAFKA_LOOKUP_GROUP_ID
            value: "{{ .FDP_APP_CDL_KAFKA_LOOKUP_GROUP_ID }}"
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC }}"
          - name: FDP_CMD_ADAPTOR_LOOKUP_INCOMING_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_LOOKUP_INCOMING_TOPIC }}"
          - name: FDP_CMD_ADAPTOR_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_TOPIC }}"
          - name: FDP_CMD_ADAPTOR_LOOKUP_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_LOOKUP_TOPIC }}"
          - name: FDP_CMD_ADAPTOR_SUSPENSE_GARBAGE_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_SUSPENSE_GARBAGE_TOPIC }}"
          - name: FDP_APP_CTP_RETRY_DELAY_TIME
            value: "{{ .FDP_APP_CTP_RETRY_DELAY_TIME }}"
          - name: FDP_APP_CTP_RETRY_PUNCTUATE_INTERVAL
            value: "{{ .FDP_APP_CTP_RETRY_PUNCTUATE_INTERVAL }}"
          - name: FDP_APP_CTP_NOT_A_PRODUCT_NAME
            value: "{{ .FDP_APP_CTP_NOT_A_PRODUCT_NAME }}"
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
  {{else if eq .ADAPTOR_NAME "iabs"}}
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_APPLIC
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_APPLIC }}"
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_BIOG
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_BIOG }}"
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DOCS
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC_DOCS }}"
  {{else if eq .ADAPTOR_NAME "placi"}}
          - name: FEED_NAME
            value: "{{ .FEED_NAME }}"
          - name: FDP_CMD_ADAPTOR_STREAM_RWANDAIR_RUN
            value: "{{ .FDP_CMD_ADAPTOR_STREAM_RWANDAIR_RUN }}"
          - name: FDP_CMD_ADAPTOR_STREAM_SAUDIA_RUN
            value: "{{ .FDP_CMD_ADAPTOR_STREAM_SAUDIA_RUN }}"
  {{else if eq .ADAPTOR_NAME "predict"}}
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC }}"
          - name: FDP_CMD_ADAPTOR_LOGICAL_COUNTER
            value: "{{ .FDP_CMD_ADAPTOR_LOGICAL_COUNTER }}"
          - name: FDP_CMD_ADAPTOR_SEPARATOR
            value: "{{ .FDP_CMD_ADAPTOR_SEPARATOR }}"
  {{else if eq .ADAPTOR_NAME "pronto"}}
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC }}"
