          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_FORM_UKVIBF
            value: landing-535
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SEARCHSTAMP_PERSONCHECK
            value: landing-150
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_ADDITIONALADDRESS
            value: landing-151
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_ARREST
            value: landing-152
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_CASHSEIZURE
            value: landing-153
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_COMPLIANT
            value: landing-154
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_CONTACTDETAILS
            value: landing-155
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_ENTRYPREMISES
            value: landing-156
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_EXTENDEDPERSON
            value: landing-157
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_ILLEGALWORKEMPLOYEE
            value: landing-158
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_ILLEGALWORKEMPLOYER
            value: landing-159
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_INTERVIEW
            value: landing-160
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_METHODENTRY
            value: landing-161
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_MITIGATINGCIRCUMSTANC
            value: landing-162
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_OPERATION
            value: landing-163
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_PROPERTYSEARCH
            value: landing-164
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_RENTLANDLORD
            value: landing-165
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_RENTTENANT
            value: landing-166
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_SEARCHSUBJECT
            value: landing-167
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_SERVED
            value: landing-168
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_USEOFFORCE
            value: landing-169
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC_DDFORM_SR_VOLDEP
            value: landing-170
  {{else}}
          - name: FDP_CMD_ADAPTOR_INCOMING_TOPIC
            value: "{{ .FDP_CMD_ADAPTOR_INCOMING_TOPIC }}"
  {{end}}
          - name: FDP_KAFKA_BROKER
            valueFrom:
              secretKeyRef:
                name: environment
                key: "{{ .FDP_KAFKA_BROKER_KEY_NAME }}"
          - name: FDP_KAFKA_SCHEMA_REGISTRY_URL
            valueFrom:
              secretKeyRef:
                name: environment
                key: FDP_KAFKA_SCHEMA_REGISTRY_URL
          - name: FDP_KAFKA_STREAM_THREADS
            value: "{{ .FDP_KAFKA_STREAM_THREADS }}"
          - name: LOG_LEVEL
            valueFrom:
              secretKeyRef:
                name: environment
                key: LOG_LEVEL
          - name: FDP_KAFKA_SESSION_TIMEOUT_MS
            value: "{{ .FDP_KAFKA_SESSION_TIMEOUT_MS }}"
          - name: FDP_KAFKA_POLL_INTERVAL_MS
            value: "{{ .FDP_KAFKA_POLL_INTERVAL_MS }}"
          - name: FDP_KAFKA_MAX_POLL_RECORDS
            value: "{{ .FDP_KAFKA_MAX_POLL_RECORDS }}"
          - name: FDP_KAFKA_REBALANCE_TIMEOUT_MS
            value: "{{ .FDP_KAFKA_REBALANCE_TIMEOUT_MS }}"
          - name: FDP_KAFKA_MAX_REQUEST_SIZE
            value: "{{ .FDP_KAFKA_MAX_REQUEST_SIZE }}"
          - name: FDP_KAFKA_TASK_TIMEOUT_MS
            value: "{{ .FDP_KAFKA_TASK_TIMEOUT_MS }}"
          - name: SPRING_PROFILES_ACTIVE
            value: "{{ .SPRING_PROFILES_ACTIVE }}"
          - name: FDP_APP_KAFKA_TOPIC_SUFFIX
