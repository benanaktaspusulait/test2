---
#############################################################################
# WARNING: This file is controlled via RepoSync, any changes made in the
# command adaptor repository will be overwritten by the RepoSync process.
# See https://gitlab.digital.homeoffice.gov.uk/dacc-de/dde-adaptor-reposync
#############################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}
  namespace: {{ .KUBE_NAMESPACE }}
  labels:
    pipeline_name: fdp-{{ .FDP_FEED_NAME }}
    app: fdp-app
{{if .WORKING_HOURS}}
  annotations:
    downscaler/uptime: {{ .WORKING_HOURS }}
{{end}}
spec:
  replicas: {{ .FDP_AGGREGATE_MATCHING_REPLICAS }}
  serviceName: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}
  template:
    metadata:
      labels:
        name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}
        service: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}-svc
        pipeline_name: fdp-{{ .FDP_FEED_NAME }}
        app: fdp-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7106"
        prometheus.io/path: "/aggregate-matching-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/prometheus"
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      imagePullSecrets:
        - name: "{{ .ARTIFACTORY_SECRET_NAME }}"
      volumes:
        - name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}-state-vol
        - name: app-msk-app-keystore
          secret:
            secretName: app-msk-app-keystore
            defaultMode: 256
      containers:
        - name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}
          command: ["java", "-jar", "/home/fdpuser/aggregate-matching.jar"]
          image: docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-matching:{{ .CORE_TAG }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            limits:
              memory: {{ .FDP_AGGREGATE_MATCHING_MEMORY_MAX }}
              cpu: {{ .FDP_AGGREGATE_MATCHING_CPU_MAX }}
            requests:
              memory: {{ .FDP_AGGREGATE_MATCHING_MEMORY_MIN }}
              cpu: {{ .FDP_AGGREGATE_MATCHING_CPU_MIN }}
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /aggregate-matching-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/liveness
              port: 7106
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /aggregate-matching-{{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}/health/readiness
              port: 7106
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - mountPath: "/home/fdpuser/fdp-msk/"
              name: app-msk-app-keystore
              readOnly: true
            - mountPath: "/home/fdpuser/persistent/"
              name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}-state-vol
          env:
            - name: FDP_APP_KAFKA_SESSION_TIMEOUT_MS
              value: "{{ .FDP_APP_KAFKA_SESSION_TIMEOUT_MS }}"
            - name: _JAVA_OPTIONS
              value: "-Xms{{ .FDP_AGGREGATE_MATCHING_JAVA_MEMORY_MIN }} -Xmx{{ .FDP_AGGREGATE_MATCHING_JAVA_MEMORY_MAX }}"
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .SPRING_PROFILES_ACTIVE }}"
            - name: FDP_KAFKA_STREAM_THREADS
              value: "{{ .FDP_KAFKA_STREAM_THREADS }}"
            - name: FDP_AGG_EVENT_LOG_DIR
              value: "/home/fdpuser/persistent/logs/"
            - name: FDP_AGG_STATE_DIR
              value: "/home/fdpuser/persistent/state/"
            - name: ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: LOG_LEVEL
            - name: FDP_APP_KAFKA_TOPIC_SUFFIX
              value: {{ .FDP_APP_KAFKA_TOPIC_SUFFIX }}
            - name: FDP_APP_ADAPTOR_SHORT_NAME
              value: {{ .FDP_APP_MATCHING_NAME }}
            - name: FDP_APP_MATCHING_AGGREGATE_TARGET
              value: {{ .FDP_APP_MATCHING_AGGREGATE_TARGET }}
            - name: FDP_APP_REDIS_NODES
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: "{{ .FDP_APP_REDIS_NODES_KEY_NAME }}"
            - name: FDP_APP_REDIS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: "{{ .FDP_APP_REDIS_AUTH_TOKEN_KEY_NAME }}"
            - name: FDP_KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: "{{ .FDP_KAFKA_BROKER_KEY_NAME }}"
            - name: FDP_KAFKA_SCHEMA_REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: environment
                  key: FDP_KAFKA_SCHEMA_REGISTRY_URL
            - name: FDP_APP_WASH_ADDRESS_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_ADDRESS_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_ADDRESS_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_ADDRESS_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_ADDRESS_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_ADDRESS_MAX_RESULTS }}"
            - name: FDP_APP_WASH_ADDRESS_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_ADDRESS_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_ADDRESS_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_ADDRESS_POLE_SOURCES }}"
            - name: FDP_APP_WASH_ADDRESS_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_ADDRESS_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_ADDRESS_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_ADDRESS_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_ADDRESS_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_ADDRESS_WASH_CONFIG_ID }}"
            - name: FDP_APP_WASH_CONTACT_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_CONTACT_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_CONTACT_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_CONTACT_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_CONTACT_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_CONTACT_MAX_RESULTS }}"
            - name: FDP_APP_WASH_CONTACT_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_CONTACT_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_CONTACT_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_CONTACT_POLE_SOURCES }}"
            - name: FDP_APP_WASH_CONTACT_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_CONTACT_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_CONTACT_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_CONTACT_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_CONTACT_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_CONTACT_WASH_CONFIG_ID }}"
            - name: FDP_APP_WASH_OBJECT_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_OBJECT_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_OBJECT_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_OBJECT_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_OBJECT_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_OBJECT_MAX_RESULTS }}"
            - name: FDP_APP_WASH_OBJECT_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_OBJECT_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_OBJECT_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_OBJECT_POLE_SOURCES }}"
            - name: FDP_APP_WASH_OBJECT_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_OBJECT_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_OBJECT_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_OBJECT_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_OBJECT_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_OBJECT_WASH_CONFIG_ID }}"
            - name: FDP_APP_WASH_ORGANISATION_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_ORGANISATION_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_ORGANISATION_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_ORGANISATION_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_ORGANISATION_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_ORGANISATION_MAX_RESULTS }}"
            - name: FDP_APP_WASH_ORGANISATION_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_ORGANISATION_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_ORGANISATION_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_ORGANISATION_POLE_SOURCES }}"
            - name: FDP_APP_WASH_ORGANISATION_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_ORGANISATION_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_ORGANISATION_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_ORGANISATION_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_ORGANISATION_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_ORGANISATION_WASH_CONFIG_ID }}"
            - name: FDP_APP_WASH_PERSON_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_PERSON_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_PERSON_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_PERSON_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_PERSON_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_PERSON_MAX_RESULTS }}"
            - name: FDP_APP_WASH_PERSON_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_PERSON_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_PERSON_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_PERSON_POLE_SOURCES }}"
            - name: FDP_APP_WASH_PERSON_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_PERSON_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_PERSON_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_PERSON_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_PERSON_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_PERSON_WASH_CONFIG_ID }}"
            - name: FDP_APP_WASH_TRANSPORT_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_TRANSPORT_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_TRANSPORT_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_TRANSPORT_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_TRANSPORT_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_TRANSPORT_MAX_RESULTS }}"
            - name: FDP_APP_WASH_TRANSPORT_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_TRANSPORT_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_TRANSPORT_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_TRANSPORT_POLE_SOURCES }}"
            - name: FDP_APP_WASH_TRANSPORT_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_TRANSPORT_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_TRANSPORT_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_TRANSPORT_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_TRANSPORT_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_TRANSPORT_WASH_CONFIG_ID }}"
            - name: FDP_APP_WASH_VIRTUAL_ENABLE_COMPARISON_DETAIL
              value: "{{ .FDP_APP_WASH_VIRTUAL_ENABLE_COMPARISON_DETAIL }}"
            - name: FDP_APP_WASH_VIRTUAL_ENTITY_TYPE
              value: "{{ .FDP_APP_WASH_VIRTUAL_ENTITY_TYPE }}"
            - name: FDP_APP_WASH_VIRTUAL_MAX_RESULTS
              value: "{{ .FDP_APP_WASH_VIRTUAL_MAX_RESULTS }}"
            - name: FDP_APP_WASH_VIRTUAL_OUTPUT_WITH_MATCHED_DATA
              value: "{{ .FDP_APP_WASH_VIRTUAL_OUTPUT_WITH_MATCHED_DATA }}"
            - name: FDP_APP_WASH_VIRTUAL_POLE_SOURCES
              value: "{{ .FDP_APP_WASH_VIRTUAL_POLE_SOURCES }}"
            - name: FDP_APP_WASH_VIRTUAL_SOURCE_THRESHOLD
              value: "{{ .FDP_APP_WASH_VIRTUAL_SOURCE_THRESHOLD }}"
            - name: FDP_APP_WASH_VIRTUAL_SEARCH_TYPE
              value: "{{ .FDP_APP_WASH_VIRTUAL_SEARCH_TYPE }}"
            - name: FDP_APP_WASH_VIRTUAL_WASH_CONFIG_ID
              value: "{{ .FDP_APP_WASH_VIRTUAL_WASH_CONFIG_ID }}"
{{if .FDP_APP_MATCHING_TYPES_TO_FILTER}}
            - name: FDP_APP_MATCHING_TYPES_TO_FILTER
              value: "{{ .FDP_APP_MATCHING_TYPES_TO_FILTER }}"
{{end}}
        - name: fdp-jaeger-agent
          image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/dacc/jaegertracing/jaeger-agent:stable
          args: [ "--reporter.grpc.host-port=dns:///fdp-jaeger-collector-svc.{{ .JAEGER_NAMESPACE }}.svc.cluster.local:14250","--reporter.type=grpc","--processor.zipkin-compact.server-queue-size={{ .FDP_SPANS_QUEUE_SIZE }}" ]
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            limits:
              memory: {{ .FDP_JAEGER_MEMORY_MAX }}
              cpu: {{ .FDP_JAEGER_CPU_MAX }}
            requests:
              memory: {{ .FDP_JAEGER_MEMORY_MIN }}
              cpu: {{ .FDP_JAEGER_CPU_MIN }}

  volumeClaimTemplates:
    - metadata:
        name: fdp-aggregate-matching-{{ .FDP_FEED_NAME }}-state-vol
        annotations:
          volume.beta.kubernetes.io/storage-class: {{ .FDP_STATE_VOLUME_TYPE }}
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .FDP_STATE_VOLUME_SIZE }}
