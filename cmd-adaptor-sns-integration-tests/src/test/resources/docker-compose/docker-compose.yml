---
#############################################################################
# WARNING: This file is controlled via RepoSync, any changes made in the
# command adaptor repository will be overwritten by the RepoSync process.
# See https://gitlab.digital.homeoffice.gov.uk/dacc-de/dde-adaptor-reposync
#
# Overriding of configured variables can be placed in a file called ".env"
# in the same directory as this file.  See
# <https://gitlab.digital.homeoffice.gov.uk/dacc-aws/fdp-cmd-adaptor-pnr/-/blob/develop/cmd-adaptor-pnr-integration-tests/src/test/resources/docker-compose/.env>
# for an example.
#############################################################################
version: '3'

services:
  aggregate-event:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-event:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8104 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9014 -Dcom.sun.management.jmxremote.rmi.port=9014 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-event.jar"
    container_name: aggregate-event
    depends_on:
      - kafka
      - schema-registry
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOG_LEVEL=INFO
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=event-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8104:8104
      - 7104:7104
      - 9014:9014
    platform: linux/amd64
    restart: always

  aggregate-location:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-location:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8103 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9013 -Dcom.sun.management.jmxremote.rmi.port=9013 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-location.jar"
    container_name: aggregate-location
    depends_on:
      - kafka
      - schema-registry
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOG_LEVEL=INFO
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=location-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8103:8103
      - 7103:7103
      - 9013:9013
    platform: linux/amd64
    restart: always

  aggregate-matching:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-matching:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8106 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9016 -Dcom.sun.management.jmxremote.rmi.port=9016 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-matching.jar"
    container_name: aggregate-matching
    depends_on:
      - kafka
      - schema-registry
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_MATCHING_AGGREGATE_TARGET=${FDP_APP_MATCHING_AGGREGATE_TARGET-BOTH}
      - FDP_APP_MATCHING_TYPES_TO_FILTER=${FDP_APP_MATCHING_TYPES_TO_FILTER-}
      - FDP_APP_MATCHING_SERVICE_ENABLED=true
      - LOG_LEVEL=INFO
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      # The following ENVs are required by PNR and APIDQ (any repo using fdp-apps v13 aggregate-matching). See PM-69684
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_MATCHING_SUBTYPES_TO_PRESERVE=${FDP_APP_MATCHING_SUBTYPES_TO_PRESERVE-}
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=matching-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8106:8106
      - 7106:7106
      - 9016:9016
    platform: linux/amd64
    restart: always

  aggregate-object:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-object:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8102 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9012 -Dcom.sun.management.jmxremote.rmi.port=9012 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-object.jar"
    container_name: aggregate-object
    depends_on:
      - kafka
      - schema-registry
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOG_LEVEL=INFO
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=object-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8102:8102
      - 7102:7102
      - 9012:9012
    platform: linux/amd64
    restart: always

  aggregate-party:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-party:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8101 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9011 -Dcom.sun.management.jmxremote.rmi.port=9011 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-party.jar"
    container_name: aggregate-party
    depends_on:
      - kafka
      - schema-registry
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOG_LEVEL=INFO
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=party-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8101:8101
      - 7101:7101
      - 9011:9011
    platform: linux/amd64
    restart: always

  aggregate-service:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-service:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8105 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9015 -Dcom.sun.management.jmxremote.rmi.port=9015 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-service.jar"
    container_name: aggregate-service
    depends_on:
      - kafka
      - schema-registry
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOG_LEVEL=INFO
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=service-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8105:8105
      - 7105:7105
      - 9015:9015
    platform: linux/amd64
    restart: always

  aggregate-v1id-v2id:
    image: "docker.digital.homeoffice.gov.uk/dacc-aws/fdp-aggregate-v1id-v2id:${CORE_TAG}"
    command: "java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8108 -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9018 -Dcom.sun.management.jmxremote.rmi.port=9018 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -jar /home/fdpuser/aggregate-v1id-v2id.jar"
    container_name: aggregate-v1id-v2id
    depends_on:
      - kafka
      - schema-registry
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOG_LEVEL=INFO
      - FDP_KAFKA_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - FDP_KAFKA_STREAM_THREADS=1
      - FDP_KAFKA_BROKER=kafka:29092
      - FDP_APP_REDIS_NODES=redis:6379
      - FDP_APP_KAFKA_STREAM_MIN_INSYNC_REPLICAS=1
      - FDP_APP_KAFKA_STREAM_REPLICATION_FACTOR=1
      - FDP_APP_KAFKA_TOPIC_SUFFIX=0
      - FDP_APP_JAEGER_HOST=jaeger
      - FDP_APP_JAEGER_PORT=4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=v1id-v2id-aggregate
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED=true
    ports:
      - 8108:8108
      - 7108:7108
      - 9018:9018
    platform: linux/amd64
    restart: always

  command-adaptor:
    image: "${COMMAND_ADAPTOR_IMAGE-docker-compose-command-adaptor:latest}"
    build: ../../../../../cmd-adaptor-sns
    container_name: command-adaptor
    environment: 
      FDP_APP_KAFKA_TOPIC_SUFFIX: 0
      WAIT_CHECK: "${WAIT_CHECK-}"
      ADAPTOR_NAME: "sns"
      SPRING_PROFILES_ACTIVE: "docker"
      ARTIFACTORY_USERNAME: "${ARTIFACTORY_USERNAME-}"
      ARTIFACTORY_PASSWORD: "${ARTIFACTORY_PASSWORD-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: "cmd_adaptor_sns"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED : "false"
      OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_VIEW_TELEMETRY_ENABLED : "false"
      OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED : "false"
      OTEL_INSTRUMENTATION_OKHTTP_ENABLED : "false"
      OTEL_INSTRUMENTATION_TOMCAT_ENABLED : "false"
      OTEL_INSTRUMENTATION_KAFKA_CLIENTS_ENABLED : "true"
      OTEL_INSTRUMENTATION_SERVLET_ENABLED : "true"
    restart: always
    ports:
      - 7112:7112
      - 8077:8077

  integration-tests:
    container_name: integration-tests
    entrypoint: mvn -Pci-snapshot install
    environment:
      FDP_APP_KAFKA_TOPIC_SUFFIX: 0
      WAIT_CHECK: "${WAIT_CHECK-}"
      ADAPTOR_NAME: "sns"
      SPRING_PROFILES_ACTIVE: "docker"
      ARTIFACTORY_USERNAME: "${ARTIFACTORY_USERNAME-}"
      ARTIFACTORY_PASSWORD: "${ARTIFACTORY_PASSWORD-}"
    image: quay.io/ukhomeofficedigital/ileap-java17-mvn:1.3
    volumes:
      - "../../../../..:/app"
    working_dir: /app

  jaeger:
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    hostname: jaeger
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - 4317:4317
      - 4318:4318
      - 14250:14250
      - 16686:16686
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 14269"]
      interval: 30s
      timeout: 10s
      retries: 3
    platform: linux/amd64
    restart: always

  kafdrop:
    container_name: kafdrop
    depends_on:
      - kafka
      - schema-registry
    environment:
      CMD_ARGS: "--message.format=AVRO --schemaregistry.connect=http://schema-registry:8081 --topic.createEnabled=false --topic.deleteEnabled=false"
      KAFKA_BROKERCONNECT: kafka:29092
    hostname: kafdrop
    image: obsidiandynamics/kafdrop:3.30.0
    ports:
      - 9000:9000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    platform: linux/amd64
    restart: always

  kafka:
    # PM-71719: MSK deployed 3.9.1 equates to cp-kafka 7.9.7
    # https://docs.confluent.io/platform/7.6/installation/versions-interoperability.html
    image: confluentinc/cp-kafka:7.9.7
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "9092"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      # "`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-
      # An important note about accessing Kafka from clients on other machines:
      # -----------------------------------------------------------------------
      #
      # The config used here exposes port 9092 for _external_ connections to the broker
      # i.e. those from _outside_ the docker network. This could be from the host machine
      # running docker, or maybe further afield if you've got a more complicated setup.
      # If the latter is true, you will need to change the value 'localhost' in
      # KAFKA_ADVERTISED_LISTENERS to one that is resolvable to the docker host from those
      # remote clients
      #
      # For connections _internal_ to the docker network, such as from other services
      # and components, use kafka:29092.
      #
      # See https://rmoff.net/2018/08/02/kafka-listeners-explained/ for details
      # "`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-'"`-._,-
      #
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,\
        kafka.producer.async.DefaultEventHandler=WARN,\
        kafka.request.logger=WARN,\
        kafka.controller=WARN,\
        kafka.log.LogCleaner=WARN,\
        state.change.logger=WARN,\
        kafka.authorizer.logger=WARN"
    platform: linux/amd64
    restart: always

  kafka-topic-extract:
    user: "${DOCKER_USER}"
    build: kafka-topic-extract
    container_name: kafka-topic-extract
    environment:
      ADAPTOR_NAME: "sns"
      FDP_APP_KAFKA_TOPIC_SUFFIX: 0
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      LOG_LEVEL: INFO
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - "${HOME}/Downloads:/mnt/downloads"

  kafka-rest:
    # PM-71719: MSK deployed 3.9.1 equates to cp-kafka 7.9.7
    # https://docs.confluent.io/platform/7.6/installation/versions-interoperability.html
    image: confluentinc/cp-kafka-rest:7.9.7
    container_name: kafka-rest
    depends_on:
      - kafka
    environment:
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "8082"]
      interval: 1s
      timeout: 1s
      retries: 30
    ports:
      - 8082:8082
    platform: linux/amd64
    restart: always

  localstack:
    container_name: "localstack"
    environment:
      LOCALSTACK_DEBUG: 1
      LOCALSTACK_SERVICES: "iam"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4566/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    image: localstack/localstack:0.12.18
    ports:
      - "127.0.0.1:4566:4566"
    platform: linux/amd64
    restart: always

  pre-integration-test:
    # This container should be started as part of the Maven
    # pre-integration-test stage of the cycle.
    build: pre-integration-test
    environment:
      FDP_APP_KAFKA_TOPIC_SUFFIX: 0
      WAIT_CHECK: "${WAIT_CHECK-}"
      ADAPTOR_NAME: "sns"
      SPRING_PROFILES_ACTIVE: "docker"
      ARTIFACTORY_USERNAME: "${ARTIFACTORY_USERNAME-}"
      ARTIFACTORY_PASSWORD: "${ARTIFACTORY_PASSWORD-}"
    container_name: pre-integration-test
    depends_on:
      - kafdrop
      - redis
      - jaeger

  schema-registry:
    # PM-71719: MSK deployed 3.9.1 equates to cp-kafka 7.9.7
    # https://docs.confluent.io/platform/7.6/installation/versions-interoperability.html
    image: confluentinc/cp-schema-registry:7.9.7
    container_name: schema-registry
    ports:
      - 8081:8081
    depends_on:
      - zookeeper
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_SSL_ENABLED_PROTOCOLS: PLAINTEXT
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 3
    platform: linux/amd64
    restart: always

  redis:
    container_name: redis
    image: redis:5.0.6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - 6379:6379
    platform: linux/amd64
    restart: always

  wait4localstack:
    command: "/usr/local/bin/wait4localstack -e http://localstack:4566/health"
    container_name: wait4localstack
    depends_on:
      - localstack
    image: "locp/wait4localstack:0.2.0"
    platform: linux/amd64

  zookeeper:
    # PM-71719: MSK deployed 3.9.1 equates to cp-kafka 7.9.7
    # https://docs.confluent.io/platform/7.6/installation/versions-interoperability.html
    image: confluentinc/cp-zookeeper:7.9.7
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - 2181:2181
    platform: linux/amd64
    restart: always
